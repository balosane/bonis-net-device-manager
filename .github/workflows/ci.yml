name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest
      - run: pytest -q
      - run: netdev --help
      - name: Ansible collection and renderer syntax check
        run: |
          pip install ansible-core==2.17.14 librouteros
          ansible-galaxy collection install community.routeros:==3.21.0 -p "$HOME/.ansible/collections"
          export ANSIBLE_COLLECTIONS_PATH="$PWD/ansible/collections:$HOME/.ansible/collections"
          ansible-doc -t module bonis.netdev.airos_cfg
          pytest -q tests/test_render.py::test_ansible_syntax_check
